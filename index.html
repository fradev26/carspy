<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>VATUUR. - Tweedehands auto&#39;s kopen en verkopen</title>
    <meta name="description" content="Doorzoek 25.000+ occasions. Vind jouw perfecte tweedehands auto bij geverifieerde dealers in Nederland en België.">
    <meta name="author" content="VATUUR." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13161B" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VATUUR." />

    <!-- Fonts: self-hosted via @fontsource (imported in src/main.tsx). No external font CDN round-trip. -->

    <!-- Modulepreload for the main entry — saves ~1 RTT discovering the JS bundle. -->
    <link rel="modulepreload" href="/src/main.tsx" as="script" crossorigin />

    <!-- Preload hero image for LCP -->
    <link rel="preload" as="image" href="/hero-image-1280.webp" imagesrcset="/hero-image-768.webp 768w, /hero-image-1280.webp 1280w, /hero-image-1920.webp 1920w" imagesizes="100vw" fetchpriority="high" type="image/webp">

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://vatuur.be/og-default.png">
    <meta property="og:url" content="https://vatuur.be/" />
    <meta property="og:locale" content="nl_BE" />
    <meta property="og:site_name" content="VATUUR." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://vatuur.be/og-default.png">
    <meta property="og:title" content="VATUUR. - Tweedehands auto&#39;s kopen en verkopen">
    <meta name="twitter:title" content="VATUUR. - Tweedehands auto&#39;s kopen en verkopen">
    <meta property="og:description" content="Doorzoek 25.000+ occasions. Vind jouw perfecte tweedehands auto bij geverifieerde dealers in België en Nederland.">
    <meta name="twitter:description" content="Doorzoek 25.000+ occasions. Vind jouw perfecte tweedehands auto bij geverifieerde dealers in België en Nederland.">

    <link rel="canonical" href="https://vatuur.be/" />

    <!-- Static LCP skeleton: ships paintable content before the JS bundle hydrates.
         React replaces #root contents on mount, so this disappears automatically. -->
    <style>
      .lcp-skeleton{position:relative;width:100%;min-height:100vh;background:#0F172A;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6rem 1rem 0;box-sizing:border-box}
      .lcp-skeleton h1{font-size:1.875rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-align:center;max-width:48rem;margin:0;text-wrap:balance}
      .lcp-skeleton .brand{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700;font-size:1.5rem;color:#E11D48;letter-spacing:-.01em;margin-bottom:1.25rem;line-height:1}
      .lcp-skeleton .sub{margin-top:.75rem;color:rgba(255,255,255,.7);font-size:.95rem;text-align:center;max-width:38rem}
      @media (min-width:1024px){.lcp-skeleton h1{font-size:3.75rem}.lcp-skeleton{padding-top:9rem}}
      @media (prefers-color-scheme: light){.lcp-skeleton{background:#F8FAFC;color:#0F172A}.lcp-skeleton .sub{color:rgba(15,23,42,.65)}}
    </style>
  </head>

  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vatuur-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var color = dark ? '#13161B' : '#F8FAFC';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function (m) { m.setAttribute('content', color); m.removeAttribute('media'); });
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div class="lcp-skeleton" aria-hidden="true">
        <div class="brand">VATUUR.</div>
        <h1>Vind je volgende auto in één zin.</h1>
        <p class="sub">Doorzoek 25.000+ occasions bij geverifieerde dealers in Nederland en België.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
